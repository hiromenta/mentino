<my-loader></my-loader>

<my-image-viewer></my-image-viewer>

@if (!isFullscreen) {
    <div class="title">{{ title }}</div>
}

<div class="container" [class.windowed]="!isFullscreen()" [class.fullscreen]="isFullscreen()">
    <div class="tabs">
        @for (tab of tabs; track tab; let i = $index) {
            <div (click)="onTabClick(tab.urls)" class="tab" [class.active]="i === getActive()">{{ getTranslation(tab.label) }}</div>
        }
    </div>

    <router-outlet></router-outlet>
</div>
